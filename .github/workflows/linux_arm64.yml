name: Build for Linux arm64 (deb)

# 在原生 ARM64 runner 上构建 PiliPlus 的 Linux arm64 安装包。
# 公共仓库可免费使用 ubuntu-24.04-arm 托管 runner（4 vCPU / 16GB）。
# 私有仓库若无 ARM64 托管 runner，可改为自建机器：
#   runs-on: [self-hosted, linux, arm64]
#
# 注意：Flutter 官方不发布 arm64 的 Linux SDK 归档
# （flutter_linux_arm64_<ver>-stable.tar.xz 不存在），因此这里用 git 检出 SDK，
# 再由 flutter precache 下载 arm64 引擎产物（dart-sdk-linux-arm64.zip 等，均可用）。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "上传到指定 Release 的 tag（留空则只产出 artifact）"
        required: false
        default: ""
        type: string

jobs:
  build-linux-arm64-deb:
    name: Release Linux arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 版本号来自 git rev-list --count HEAD

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libasound2-dev libmpv-dev \
            libblkid-dev liblzma-dev dpkg-dev file

      - name: Setup Flutter (git checkout, pinned)
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_VERSION="$(sed -n 's/^  flutter:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -1)"
          echo "pubspec 指定 Flutter: $FLUTTER_VERSION"
          if git clone --depth 1 --branch "$FLUTTER_VERSION" \
                 https://github.com/flutter/flutter.git "$HOME/flutter"; then
            echo "已检出 tag $FLUTTER_VERSION"
          else
            echo "tag 检出失败，退回 stable 分支"
            git clone --depth 1 https://github.com/flutter/flutter.git "$HOME/flutter"
          fi
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Warm up Flutter toolchain
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter config --enable-linux-desktop
          # 拉取 linux-arm64 引擎产物与 dart sdk，提前暴露下载问题
          flutter precache --linux
          uname -m

      - name: Build and package deb
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build_deb_arm64.sh 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: build_log
          path: build.log
          if-no-files-found: ignore

      - name: Upload deb artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Linux_deb_arm64_package
          path: dist/PiliPlus_linux_*_arm64.deb
          if-no-files-found: error

      - name: Release
        if: ${{ success() && github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          files: dist/PiliPlus_linux_*_arm64.deb
